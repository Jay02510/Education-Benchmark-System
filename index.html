    <script>
      (function() {
        const win = window;
        win.process = win.process || { env: {} };
        win.process.env = win.process.env || {};
        const k = win.process.env.API_KEY || win.process.env.VITE_API_KEY || win.API_KEY || (win.ENV && win.ENV.API_KEY) || "";
        if (k) {
          win.process.env.API_KEY = k;
          win.API_KEY = k;
        }
      })();
    </script>

    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        margin: 0; 
        padding: 0; 
        background-color: #f8fafc; 
        overflow-x: hidden; 
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s ease;
      }
      #root { min-height: 100vh; }
      #root:empty::before {
        content: 'Benchmark Core Initializing...';
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-weight: 800;
        color: #6366f1;
        letter-spacing: -0.025em;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
      
      /* Global Smooth Scrolling */
      html { scroll-behavior: smooth; }
      
      /* Custom Scrollbar for Intelligence */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

      /* Micro-animation classes */
      .scale-hover { transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      .scale-hover:hover { transform: scale(1.02); }
      .scale-hover:active { transform: scale(0.98); }
    </style>
