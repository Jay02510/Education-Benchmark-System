    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        margin: 0; 
        padding: 0; 
        background-color: #f6f8fb; 
        overflow-x: hidden; 
        -webkit-font-smoothing: antialiased;
      }
      #root { min-height: 100vh; }
      #root:empty::before {
        content: 'Benchmark Intelligence Booting...';
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-weight: 800;
        color: #6366f1;
        letter-spacing: -0.025em;
        animation: pulse 2s infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 12px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      
      /* Subtle mesh gradient grid overlay */
      .bg-ambient-lights {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .glow-orb-1 {
        position: absolute;
        top: -10%;
        right: -5%;
        width: 60vw;
        height: 60vw;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(255,255,255,0) 70%);
        border-radius: 50%;
        filter: blur(80px);
      }
      .glow-orb-2 {
        position: absolute;
        bottom: -15%;
        left: -10%;
        width: 50vw;
        height: 50vw;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(255,255,255,0) 70%);
        border-radius: 50%;
        filter: blur(100px);
      }
      .glow-orb-3 {
        position: absolute;
        top: 40%;
        left: 20%;
        width: 35vw;
        height: 35vw;
        background: radial-gradient(circle, rgba(236, 72, 153, 0.06) 0%, rgba(255,255,255,0) 70%);
        border-radius: 50%;
        filter: blur(60px);
      }
      .grid-pattern {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(to right, rgba(0, 0, 0, 0.015) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(0, 0, 0, 0.015) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.95;
      }
