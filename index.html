
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benchmark | Educator Analytics</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://esm.sh" crossorigin>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              slate: {
                950: '#070a13',
              },
              brand: {
                50: '#f5f7ff',
                100: '#ebf0ff',
                200: '#d6e0ff',
                300: '#b3c7ff',
                400: '#85a3ff',
                500: '#6366f1', // Beautiful Indigo
                600: '#4f46e5',
                700: '#4338ca',
                800: '#3730a3',
                900: '#312e81',
              }
            },
            boxShadow: {
              'premium': '0 20px 40px -15px rgba(15, 23, 42, 0.04)',
              'premium-hover': '0 30px 60px -15px rgba(99, 102, 241, 0.12)',
              'glow-indigo': '0 0 30px 2px rgba(99, 102, 241, 0.12)',
              'glow-emerald': '0 0 30px 2px rgba(16, 185, 129, 0.12)',
              'glow-rose': '0 0 30px 2px rgba(244, 63, 94, 0.12)',
            },
            animation: {
              'float-slow': 'floatSlow 8s ease-in-out infinite',
              'float-medium': 'floatMedium 6s ease-in-out infinite',
              'pulse-soft': 'pulseSoft 3s ease-in-out infinite',
            },
            keyframes: {
              floatSlow: {
                '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                '50%': { transform: 'translateY(-15px) rotate(2deg)' },
              },
              floatMedium: {
                '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                '50%': { transform: 'translateY(-10px) rotate(-1deg)' },
              },
              pulseSoft: {
                '0%, 100%': { opacity: '0.8', transform: 'scale(1)' },
                '50%': { opacity: '0.4', transform: 'scale(1.05)' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Environment Shim -->
    <script type="module">
      window.process = window.process || { env: {} };
      // Bridge Vite's environment to the expected process.env.API_KEY
      const key = (import.meta.env && import.meta.env.VITE_API_KEY) || "";
      if (key) window.process.env.API_KEY = key;
    </script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
    "firebase/app": "https://esm.sh/firebase@11.1.0/app",
    "firebase/auth": "https://esm.sh/firebase@11.1.0/auth",
    "firebase/firestore": "https://esm.sh/firebase@11.1.0/firestore",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "firebase/": "https://esm.sh/firebase@^12.8.0/"
  }
}
</script>
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        margin: 0; 
        padding: 0; 
        background-color: #f6f8fb; 
        overflow-x: hidden; 
        -webkit-font-smoothing: antialiased;
      }
      #root { min-height: 100vh; }
      #root:empty::before {
        content: 'Benchmark Intelligence Booting...';
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-weight: 800;
        color: #6366f1;
        letter-spacing: -0.025em;
        animation: pulse 2s infinite;
      }
      @keyframe pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 12px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      
      /* Subtle mesh gradient grid overlay */
      .bg-ambient-lights {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .glow-orb-1 {
        position: absolute;
        top: -10%;
        right: -5%;
        width: 60vw;
        height: 60vw;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(255,255,255,0) 70%);
        border-radius: 50%;
        filter: blur(80px);
      }
      .glow-orb-2 {
        position: absolute;
        bottom: -15%;
        left: -10%;
        width: 50vw;
        height: 50vw;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(255,255,255,0) 70%);
        border-radius: 50%;
        filter: blur(100px);
      }
      .glow-orb-3 {
        position: absolute;
        top: 40%;
        left: 20%;
        width: 35vw;
        height: 35vw;
        background: radial-gradient(circle, rgba(236, 72, 153, 0.06) 0%, rgba(255,255,255,0) 70%);
        border-radius: 50%;
        filter: blur(60px);
      }
      .grid-pattern {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(to right, rgba(0, 0, 0, 0.015) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(0, 0, 0, 0.015) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.95;
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="text-gray-800 antialiased relative">
    <!-- Sophisticated background accent system active globally -->
    <div class="bg-ambient-lights">
      <div class="grid-pattern"></div>
      <div class="glow-orb-1 animate-pulse-soft"></div>
      <div class="glow-orb-2 animate-pulse-soft" style="animation-delay: 2s"></div>
      <div class="glow-orb-3 animate-pulse-soft" style="animation-delay: 4s"></div>
    </div>
    <div id="root" class="relative z-10"></div>
    <script type="module" src="./index.tsx"></script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
